{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cafe Order{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'order/style.css' %}">
    <link rel="icon" href="{% static 'order/logo.svg' %}" >
</head>
<body>
    <header class="top">
        <a href="{% url 'home' %}" class="brand">
            <img src="{% static 'order/logo.jpg' %}" alt="" width="34" height="34"> namma cafe
        </a>
        <nav>
            <a href="{% url 'menu' %}">Menu</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'service' %}">Service</a>
            
        </nav>
    </header>
      <main>
        {% block content %}
        {% endblock %}
      </main>
      <footer>namma cafe,{% now "Y" %}</footer>
    </body>
</html>
