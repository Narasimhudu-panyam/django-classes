{% extends "order/base.html" %}
{% block title %}Bill | {{ block.super }}{% endblock %}

{% block content %}
    <h1>Your bill</h1>
    <p>{{ qty }} x {{ dish.name}}</p>
    <p>Price per dish: Rs {{ dish.price }}</p>
    <p>Total: Rs {{ total }}</p>
    <a class="button" href="{% url 'menu' %}">Back to menu</a>
{% endblock %}
