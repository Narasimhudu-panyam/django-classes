{% extends 'order/base.html' %}

{% block title %}place order | {{ block.super }}{% endblock %}

{% block content %}
    <h1>Place Your Order</h1>
    <form method="post" >
        {% csrf_token %}
        <p>
            <label>name:</label>
            <input type="text" name="name" required>
        </p>
       <p>
        <label>Dish ID:</label>
        <input type="number" name="dish_id" min="1" max="100" required>
       </p>
       <p>
        <label>Quantity:</label>
        <input type="number" name="qty" min="1" max="10" required>
       </p>
       <p>
        <input type="submit" value="Place Order">
       </p>
    </form>
    {% endblock %}
